services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      HOMEPAGE_ALLOWED_HOSTS: 10.0.0.61:3000,pi4:3000,dash.home.arpa:3000 # required, may need port. See gethomepage.dev/installation/#homepage_allowed_hosts
#      HOMEPAGE_ALLOWED_HOSTS: dash.home.arpa:3000
      PUID: 1000 # optional, your user id
      PGID: 1000 # optional, your group id
    ports:
      - 3000:3000
    volumes:
      - /home/william/docker/homepage:/app/config # Make sure your local config directory exists
      - /var/run/docker.sock:/var/run/docker.sock:ro # optional, for docker integrations
    restart: unless-stopped
